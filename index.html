<!DOCTYPE html>
<html lang="en">
<head>
<!--
  PUBLISH ON GITHUB PAGES
  1. On github.com open (or create) a PUBLIC repo named exactly YOURUSERNAME.github.io
  2. Add file > Upload files > drop this index.html > Commit
  3. Settings > Pages > Deploy from a branch > main / (root) > Save
  4. Live at https://YOURUSERNAME.github.io in about a minute

  EDIT: everything on the page comes from the SITE block in the script near the bottom.
  PROJECTS are whole games, start to end. Each opens its own page: the game loop, then every system inside it on its own, with its clip.
  A project page has its own address (yoursite/#quarterstaff-combat-kit), so you can send someone straight to it.
  VIDEOS: short clips are video files in a "clips" folder next to this file (clip: "clips/impact.mp4"). Upload the folder with it.
         Long videos (the full loop, trailers) are YouTube links (yt: "..."). Any slot takes either one; if both are set, the clip wins.
         Clips play even when you open this file from a folder; YouTube videos only play once the site is online.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#161618">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Soumaya - Roblox Scripter</title>
<meta name="description" content="Roblox scripter: combat, abilities and server-checked game systems. Projects, systems and contact.">
<meta property="og:type" content="website">
<meta property="og:title" content="Soumaya - Roblox Scripter">
<meta property="og:description" content="Roblox scripter: combat, abilities and server-checked game systems.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='14' width='36' height='36' rx='6' transform='rotate(15 32 32)' fill='%238b5cf6'/%3E%3Crect x='27' y='27' width='10' height='10' rx='1' transform='rotate(15 32 32)' fill='%23161618'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bar-h:72px;                 /* height of the top bar */
  --po-h:68px;                  /* top bar on a project page */
  --display:Sora,"Segoe UI",system-ui,sans-serif;
  --body:Manrope,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --bg:#161618;                 /* page */
  --bg2:#1b1b1e;                /* solid sections (the little character hides behind these) */
  --card:#212125;
  --grid:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --rule:rgba(255,255,255,.2);
  --text:#f2f2f4;--mute:#a4a4ae;--dim:#71717c;
  --accent:#8b5cf6;--accent-2:#c4b5fd;
  --grad:linear-gradient(100deg,#8b5cf6 0%,#a78bfa 48%,#e0c3fc 100%);
  --r:14px;
}

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--bar-h) - 4px);background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%}
body,.po{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
body{min-height:100vh;font:400 1rem/1.65 var(--body);color:var(--text);overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit}
ul,ol{list-style:none}
svg{display:block;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:1rem;top:1rem;z-index:50;background:var(--accent);color:#fff;padding:.6rem 1rem;font-weight:700}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:clamp(1.1rem,4vw,2.5rem)}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.grad{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nb{white-space:nowrap}
.eyebrow{font:800 .76rem/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase}

/* everything sits above the little character, so it hides behind anything solid: the Projects section, the cards */
main,footer.site{position:relative;z-index:2}

/* ---------- Top bar: logo and name on the left, menu in the middle, "Start a project" on the right ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);background:linear-gradient(90deg,transparent 55%,rgba(139,92,246,.16) 96%),rgba(22,22,24,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5rem;height:var(--bar-h);padding-inline:clamp(1rem,3.4vw,4.25rem)}
.brand{display:flex;align-items:stretch;gap:.9rem;min-width:0;justify-self:start;padding:.2rem 0;text-decoration:none;transform:skewX(-10deg)}
.bars{display:flex;gap:5px;flex:none;transition:gap .25s}
.bars i{width:7px;border-radius:1px;background:var(--accent)}
.bars i+i{width:3px;background:var(--text)}
.brand:hover .bars,.brand:focus-visible .bars{gap:9px}
.who{display:flex;flex-direction:column;justify-content:center;min-width:0}
.who b,.who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who b{font:800 clamp(1.25rem,1.1rem + .5vw,1.5rem)/1 var(--display);letter-spacing:-.01em}
.who small{margin-top:.3rem;color:var(--mute);font:600 .78rem/1.1 var(--body)}
.nav{display:flex;justify-self:center;gap:clamp(1.4rem,2.4vw,2.1rem)}
.nav a{position:relative;padding:.55rem 0;text-decoration:none;font:600 .82rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;transition:color .2s}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.nav a:hover,.nav a:focus-visible,.nav a.on{color:var(--accent-2)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.topcta{display:flex;align-items:center;align-self:stretch;justify-self:end;gap:1.2rem;padding-left:1.4rem;border-left:1px solid var(--rule);text-decoration:none;font:600 .82rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase}
.lbl{white-space:nowrap}
.sq{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;transition:filter .2s,transform .2s}
.sq svg{width:12px;height:12px}
.topcta:hover .sq,.topcta:focus-visible .sq{filter:brightness(1.12);transform:translate(2px,-2px)}

/* ---------- Opening ---------- */
.hero{position:relative;display:grid;grid-template-rows:1fr auto;min-height:calc(100vh - var(--bar-h));min-height:calc(100svh - var(--bar-h));padding:2rem 0 clamp(1.6rem,4vh,2.4rem);text-align:center}
.hero>.wrap:first-child{align-self:start}
.hero .avail{margin-top:0}
.hero h1{margin-top:1rem}
/* the highlight reel: gameplay on the first screen */
.reel{max-width:1000px;margin:clamp(2rem,5vh,3rem) auto 0}
.reel .media{border-radius:18px;box-shadow:0 0 0 1px var(--line2),0 40px 90px -40px rgba(139,92,246,.55)}
.reel figcaption{margin-top:.8rem;color:var(--dim);font:700 .76rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
/* my role, proof numbers, play button */
.cred{display:flex;flex-direction:column;align-items:center;gap:1.2rem;margin:-1rem auto 2.4rem;text-align:center}
.role-line{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:.7rem;max-width:62ch;padding:.6rem 1.1rem;border:1px solid var(--line2);border-radius:12px;background:var(--card);font-weight:600}
.role-line b{padding:.25rem .55rem;border-radius:6px;background:rgba(139,92,246,.18);color:var(--accent-2);font:800 .7rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
.proof{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem 3rem}
.proof dt{font:800 clamp(1.6rem,1.2rem + 1.2vw,2.2rem)/1 var(--display);letter-spacing:-.03em}
.proof dd{margin-top:.3rem;color:var(--mute);font-weight:600;font-size:.88rem}
.btn.play svg{width:20px;height:20px}
/* captions under clips, the code button, "See it" links, quotes */
.sysband .part .cap{margin-top:.35rem;color:var(--mute);font-size:.95rem;line-height:1.5}
.band-side{display:flex;align-items:center;gap:.6rem;align-self:flex-start;margin-left:auto}
.band-side>small{padding:.4rem .75rem;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;color:var(--c);font:700 .8rem/1 var(--body);white-space:nowrap}
.codebtn{display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .8rem;border-radius:999px;background:var(--c);color:#17171a;font:800 .8rem/1 var(--body);text-decoration:none;white-space:nowrap}
.codebtn svg{width:11px;height:11px}
.see{display:inline-flex;align-items:center;gap:.45rem;margin-top:1rem;color:var(--accent-2);font:700 .86rem/1 var(--body);text-decoration:none}
.see svg{width:12px;height:12px}
.see:hover{text-decoration:underline;text-underline-offset:4px}
.vouches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1.2rem}
.vouch{padding:1.4rem 1.5rem;border:1px solid var(--line2);border-radius:var(--r);background:var(--card)}
.vouch p{font-size:1.02rem}
.vouch footer{margin-top:.9rem;color:var(--mute);font-weight:700;font-size:.88rem}
.vouch a{color:var(--accent-2)}
.hero-bot{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;margin-top:2rem}
.explore{justify-self:center;display:inline-flex;align-items:center;gap:.9rem;padding:.6rem 0 .7rem;border-bottom:1px solid var(--line2);font:700 .78rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:border-color .2s,color .2s}
.explore svg{width:13px;height:13px;color:var(--accent-2)}
.explore:hover,.explore:focus-visible{border-color:var(--accent);color:var(--accent-2)}
.reply{display:grid;justify-items:end;justify-self:end;gap:.3rem;text-align:right}
.reply small{color:var(--dim);font:800 .66rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
.reply span{font-size:.9rem;font-weight:700}
@media(max-width:640px){.hero-bot{grid-template-columns:1fr;justify-items:center;gap:1rem}.hero-bot>span:empty,.reply{display:none}}
.hero::before{content:"";position:absolute;left:50%;top:38%;z-index:-1;width:min(60rem,92vw);aspect-ratio:2;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(139,92,246,.14),transparent);pointer-events:none}
.hero h1{max-width:20ch;margin:1.3rem auto 0;font-size:clamp(3rem,1.2rem + 6vw,6.6rem);line-height:1.05;letter-spacing:-.04em;text-wrap:balance}
.sub{max-width:52ch;margin:1.4rem auto 0;color:var(--mute);font-size:clamp(1.02rem,.95rem + .3vw,1.2rem);text-wrap:balance}
.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:1rem 2rem;margin-top:2.3rem}
.box{display:inline-flex;align-items:center;gap:1.2rem;padding:1rem 1.5rem;border:1px solid var(--line2);border-radius:10px;background:#1d1d21;font:700 1.04rem/1 var(--body);text-decoration:none;transition:border-color .2s,background .2s}
.box svg{width:15px;height:15px;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.box:hover,.box:focus-visible{border-color:var(--accent);background:#211e2a}
.box:hover svg,.box:focus-visible svg{transform:translateX(3px)}
.lnk{display:inline-flex;align-items:center;gap:.7rem;padding:.5rem 0;font:700 1.04rem/1 var(--body);text-decoration:none;transition:color .2s}
.lnk svg{width:21px;height:21px;color:var(--accent-2)}
.lnk:hover,.lnk:focus-visible{color:var(--accent-2)}
.avail{display:inline-flex;align-items:center;gap:.65rem;margin-top:2.4rem;padding:.55rem 1rem;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.03);color:var(--mute);font:700 .82rem/1 var(--body)}
.avail i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.avail.off i{background:var(--dim);box-shadow:none}

/* ---------- Sections ---------- */
.sec{position:relative;padding:clamp(3.4rem,7vw,5.6rem) 0;border-top:1px solid var(--rule)}
.solid{background:var(--bg2)}
.sec-head{margin-bottom:clamp(2.4rem,5vw,3.8rem);text-align:center}
.sec-title{font-size:clamp(1.6rem,1.2rem + 1.2vw,2.2rem);font-weight:600}
.sec-intro{max-width:54ch;margin:.7rem auto 0;color:var(--mute)}

/* ---------- Career layout: text on the left, a coloured card on the right that stays put and swaps as you read.
   Used for the projects on the home page and for the systems on a project page. On phones each card sits under its text. ---------- */
.career{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(2rem,6vw,5.5rem);align-items:start}
.c-lead{font-size:clamp(2rem,1.4rem + 2vw,3rem);letter-spacing:-.035em}
.c-lead-sub{margin-top:.6rem;color:var(--mute)}
.c-list{display:grid;gap:clamp(4rem,22vh,10rem);margin-top:clamp(2rem,5vh,3rem);padding-bottom:clamp(1rem,14vh,7rem)}
.c-item{scroll-margin-top:calc(var(--po-h) + 2rem);transition:opacity .45s ease}
.career.live .c-item{opacity:.32}
.career.live .c-item.on,.career.live .c-item:focus-within{opacity:1}
.career.live .c-item:not(.on):hover{opacity:.6}
.c-num{color:var(--dim);font:800 .72rem/1 var(--body);letter-spacing:.16em;font-variant-numeric:tabular-nums}
.c-item h3{margin-top:.6rem;font-size:clamp(1.45rem,1.15rem + .9vw,1.85rem)}
.c-item h3 button{font:inherit;letter-spacing:inherit;transition:color .2s}
.c-item h3 button:hover{color:var(--accent-2)}
.c-role{margin-top:.3rem;color:var(--mute);font-size:.9rem;font-weight:700}
.c-when{margin-top:.15rem;color:var(--dim);font-size:.86rem;font-weight:600}
.c-when b{color:var(--accent-2);font-weight:700}
.c-text{margin-top:.9rem}
.bul{display:grid;gap:.42rem;margin-top:.9rem}
.bul li{position:relative;padding-left:1.15rem;color:var(--mute);font-size:.93rem;line-height:1.55}
.bul li::before{content:"";position:absolute;left:.15rem;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.1rem}
.chips li{padding:.32rem .7rem;border-radius:7px;background:rgba(139,92,246,.15);color:var(--accent-2);font:700 .76rem/1.2 var(--body)}
.go{display:inline-flex;align-items:center;gap:.7rem;margin-top:1.4rem;padding:.75rem 1.05rem;border:1px solid var(--line2);border-radius:9px;background:#1d1d21;font:700 .92rem/1 var(--body);transition:border-color .2s,color .2s}
.go svg{width:13px;height:13px;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.go:hover,.go:focus-visible{border-color:var(--accent);color:var(--accent-2)}
.go:hover svg,.go:focus-visible svg{transform:translateX(3px)}
.c-right{align-self:stretch}   /* the right column runs the full height, so the card can stay put inside it */
.c-stick{position:sticky;top:calc(var(--bar-h) + 2vh)}
.stack{display:grid}
.pcard{grid-area:1/1;display:flex;flex-direction:column;gap:1.3rem;padding:clamp(1.2rem,2.2vw,1.7rem) clamp(1.2rem,2.2vw,1.7rem) 0;border-radius:var(--r);background:var(--c,var(--accent));overflow:hidden;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .45s ease,transform .55s cubic-bezier(.22,1,.36,1),visibility 0s .55s}
.pcard.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.pcard h4{max-width:22ch;color:#fff;font-size:clamp(1.2rem,1rem + .7vw,1.55rem);line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.18)}
.pcard .media{margin-top:auto;border-radius:12px 12px 0 0;box-shadow:0 -14px 40px -20px rgba(0,0,0,.5)}
.pcard.inline{display:none}
/* no line set (card: "") = just the video, no coloured frame */
.pcard.bare{padding:0;background:none}
.pcard.bare .media{border-radius:var(--r);box-shadow:0 0 0 1px var(--line2),0 30px 60px -30px rgba(0,0,0,.7)}

/* ---------- Videos ---------- */
.media{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#0d0d0f center/cover no-repeat}
.vp{position:absolute;inset:0;opacity:.01;transition:opacity .5s}   /* not 0: some browsers won't autoplay a fully transparent video */
.vp.on{opacity:1}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.media.playing iframe{pointer-events:auto}
.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0d0d0f;opacity:0;transition:opacity .4s}
.media video.on,.media.playing video{opacity:1}
.media.clip.playing video{object-fit:contain;background:#000}
.media.broken::after{content:"Clip file not found";position:absolute;inset:auto .8rem .8rem;padding:.4rem .6rem;border-radius:7px;background:rgba(10,10,12,.85);color:var(--mute);font:700 .75rem/1.2 var(--body)}
.hit{position:absolute;inset:0;z-index:1;display:grid;place-items:center;cursor:pointer}
.badge{display:grid;place-items:center;width:3.4rem;height:3.4rem;border:1px solid rgba(255,255,255,.28);border-radius:50%;background:rgba(15,15,18,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s,border-color .2s}
.badge svg{width:15px;height:15px}
.hit:hover .badge,.hit:focus-visible .badge{transform:scale(1.08);background:var(--accent);border-color:var(--accent)}
.media.playing .hit{display:none}
/* while a preview is playing, the button only shows on hover (always on touch screens) so it doesn't cover the gameplay */
@media(hover:hover){
  .media:has(video.on) .badge,.media:has(.vp.on) .badge{opacity:0;transform:scale(.85)}
  .media:hover .badge,.hit:focus-visible .badge{opacity:1;transform:none}
}
.badge{transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s,border-color .2s,opacity .25s}
.media.empty{display:grid;place-items:center;background:repeating-linear-gradient(135deg,rgba(0,0,0,.22) 0 14px,rgba(0,0,0,.12) 14px 28px)}
.media.empty .msg{padding:1rem;color:rgba(255,255,255,.8);font:800 .72rem/1.5 var(--body);letter-spacing:.16em;text-transform:uppercase;text-align:center}
button.media.empty{cursor:pointer}
.note{position:absolute;z-index:2;left:.8rem;right:.8rem;top:.8rem;padding:.6rem .8rem;border-radius:8px;background:rgba(10,10,12,.86);color:var(--text);font:600 .8rem/1.45 var(--body)}
.note a{color:var(--accent-2)}

/* ---------- Standalone systems: a grid of cards ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:1.2rem}
.scard{position:relative;display:flex;flex-direction:column;padding:.75rem .75rem 1.3rem;border:1px solid var(--line2);border-radius:var(--r);background:var(--card);transition:border-color .25s,transform .3s cubic-bezier(.22,1,.36,1)}
.scard:hover,.scard:focus-within{border-color:rgba(139,92,246,.6);transform:translateY(-3px)}
.scard .media{border-radius:10px}
.scard .body{display:flex;flex-direction:column;flex:1;padding:1.05rem .5rem 0}
.scard .lab{color:var(--dim);font:800 .7rem/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase}
.scard h3{margin-top:.5rem;font-size:1.22rem}
.scard h3 button{font:inherit;letter-spacing:inherit}
.scard h3 button::after{content:"";position:absolute;inset:0;border-radius:var(--r)}   /* the whole card is clickable */
.scard .media .hit{z-index:2}
.scard p{margin-top:.5rem;color:var(--mute);font-size:.92rem}
.scard .chips{margin-top:auto;padding-top:1rem}

/* ---------- Skills: cards in two columns of different heights ---------- */
.skills{columns:2 340px;column-gap:1.2rem}
.skill{break-inside:avoid;margin-bottom:1.2rem;padding:1.35rem 1.45rem 1.45rem;border:1px solid var(--line2);border-radius:var(--r);background:var(--card)}
.skill h3{font-size:1.12rem}
.skill p{margin-top:.4rem;color:var(--mute);font-size:.92rem}
.skill .chips{margin-top:1rem}

/* ---------- Contact ---------- */
.cta{text-align:center}
.cta h2{max-width:19ch;margin:0 auto;font-size:clamp(2rem,1.2rem + 2.8vw,3.5rem);letter-spacing:-.035em;text-wrap:balance}
.btn{display:inline-flex;align-items:center;gap:.8rem;padding:1rem 1.5rem;border-radius:10px;background:var(--accent);color:#fff;font:700 1.04rem/1 var(--body);text-decoration:none;box-shadow:0 14px 32px -16px rgba(139,92,246,.9);transition:filter .2s,transform .15s}
.btn svg{width:19px;height:19px}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}

.buddy{--s:54px;position:fixed;left:0;top:0;z-index:1;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);pointer-events:none;opacity:0;transition:opacity .4s;will-change:transform}

}

/* ---------- fade things up as they scroll in ---------- */
(()=>{
  const rv=[...document.querySelectorAll(".rv")];
  if(typeof IntersectionObserver==="undefined"){rv.forEach(el=>el.classList.add("in"));return}
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}}),{rootMargin:"0px 0px -8% 0px"});
  rv.forEach(el=>io.observe(el));
})();
(()=>{
  /* the menu link for the section you're in: the last section whose top has passed 40% of the screen; above them all, Home.
     At the very bottom of the page the last section wins, even if it's too short to reach that line. */
  const links=[...document.querySelectorAll(".nav a")];
  const secs=links.map(a=>a.getAttribute("href")==="#top"?null:document.querySelector(a.getAttribute("href")));
  let queued=false,cur=-1;
  const update=()=>{
    queued=false;
    let k=0;
    const line=innerHeight*.4,bottom=innerHeight+scrollY>=document.documentElement.scrollHeight-2;
    secs.forEach((el,j)=>{if(el&&el.getBoundingClientRect().top<line)k=j});
    if(bottom&&scrollY>0)k=secs.length-1;
    if(k===cur)return;
    cur=k;links.forEach((a,j)=>a.classList.toggle("on",j===k));
  };
  const ask=()=>{if(!queued){queued=true;requestAnimationFrame(update)}};
  addEventListener("scroll",ask,{passive:true});
  addEventListener("resize",ask);
  addEventListener("load",update);
  update();
})();

/* ---------- videos ----------
   Videos play by themselves, muted and looping, while they're on screen (and pause when you scroll away).
   On a project page, clicking a video plays it with sound and controls. YouTube's player script loads only when a video first needs it.
   Opened straight from a folder (file://) YouTube refuses to play embeds, so you only see thumbnails until the site is online. */
const LOCAL=location.protocol==="file:",STILL=matchMedia("(prefers-reduced-motion:reduce)").matches;
let ytLoading=false,ytFailed=false,pageOpen=false;const ytWaiting=[];
const withApi=cb=>{
  if(window.YT&&YT.Player)return cb(true);
  if(ytFailed)return cb(false);
  ytWaiting.push(cb);
  if(ytLoading)return;
  ytLoading=true;
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{if(prev)prev();ytWaiting.splice(0).forEach(f=>f(true))};
  const s=document.createElement("script");
  s.src="https://www.youtube.com/iframe_api";
  s.onerror=()=>{ytFailed=true;ytWaiting.splice(0).forEach(f=>f(false))};
  document.head.append(s);
};
const players=new Map();   /* video element -> its muted preview player */
const preview=(m,on)=>{
  let c=players.get(m);
  if(!on){if(c){c.want=false;if(c.ready&&!c.dead)try{c.p.pauseVideo()}catch(_){}}return}
  if(STILL||LOCAL)return;
  if(c){c.want=true;if(c.ready&&!c.dead)try{c.p.mute();c.p.playVideo()}catch(_){}return}
  c={want:true,ready:false,dead:false,p:null};players.set(m,c);
  withApi(ok=>{
    if(!ok||!m.isConnected||players.get(m)!==c)return;
    const id=m.dataset.yt,vp=m.querySelector(".vp");
    if(!vp)return;
    c.p=new YT.Player(vp.firstElementChild,{
      host:"https://www.youtube-nocookie.com",
      videoId:id,
      playerVars:{autoplay:0,mute:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,rel:0,playsinline:1,modestbranding:1,loop:1,playlist:id},
      events:{
        onReady:ev=>{c.ready=true;const f=ev.target.getIframe();f.tabIndex=-1;f.title="Preview: "+m.dataset.title;if(c.want)ev.target.playVideo()},
        onStateChange:ev=>{if(ev.data===1)vp.classList.add("on");else if(ev.data===0){ev.target.seekTo(0);ev.target.playVideo()}},
        onError:()=>{c.dead=true;try{c.p.destroy()}catch(_){}vp.remove()}
      }
    });
  });
};
const drop=m=>{const c=players.get(m);if(c){try{c.p&&c.p.destroy()}catch(_){}players.delete(m)}};
/* clip files: the file starts downloading a little before the clip scrolls in, and plays while you stream it (no full download first) */
const clipVideo=m=>{
  const v=m.querySelector("video");
  if(v&&!v.getAttribute("src")){
    v.preload="auto";v.src=m.dataset.clip;
    v.addEventListener("loadeddata",()=>v.classList.add("on"),{once:true});
    v.addEventListener("error",()=>{m.classList.add("broken");console.warn("Couldn't load clip:",m.dataset.clip)},{once:true});
  }
  return v;
};
const clipPreview=(m,on)=>{
  const v=m.querySelector("video");
  if(!v)return;
  if(!on){if(!v.paused)v.pause();return}
  clipVideo(m);
  if(STILL)return;   /* reduced motion: show the first frame, play only when clicked */
  v.muted=true;
  const p=v.play();if(p&&p.catch)p.catch(()=>{});
};
const layerOn=m=>{const l=m.closest(".pcard.layer");return !l||l.classList.contains("on")};
const sync=m=>{
  if(!m.classList.contains("auto")||m.classList.contains("playing"))return;
  const inPage=!!m.closest(".po"),on=!!m._vis&&layerOn(m)&&(inPage||!pageOpen)&&!document.hidden;
  if(m.classList.contains("clip"))clipPreview(m,on);else preview(m,on);
};
const syncAll=()=>document.querySelectorAll(".media.auto").forEach(sync);
const vio=typeof IntersectionObserver!=="undefined"?new IntersectionObserver(es=>es.forEach(en=>{en.target._vis=en.intersectionRatio>=.4;sync(en.target)}),{threshold:[0,.4]}):null;
/* starts fetching a clip about half a screen before it scrolls in */
const nio=typeof IntersectionObserver!=="undefined"?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){clipVideo(en.target);nio.unobserve(en.target)}}),{rootMargin:"50% 0px"}):null;
const watch=root=>root.querySelectorAll(".media.auto").forEach(m=>{
  m._html=m.innerHTML;
  if(m.classList.contains("clip")){if(nio)nio.observe(m);else clipVideo(m)}
  if(vio)vio.observe(m);else{m._vis=true;sync(m)}
});
const unwatch=root=>root.querySelectorAll(".media.auto").forEach(m=>{
  if(vio)vio.unobserve(m);if(nio)nio.unobserve(m);
  const v=m.querySelector("video");if(v){v.pause();v.removeAttribute("src");v.load()}   /* frees the download */
  drop(m);
});
document.addEventListener("visibilitychange",syncAll);
const stopSound=m=>{
  const v=m.querySelector("video");
  if(m.classList.contains("clip")&&v){v.muted=true;v.controls=false}
  else if(m._html!==undefined)m.innerHTML=m._html;
  m.classList.remove("playing");sync(m);
};
const playSound=m=>{
  if(!m)return;
  document.querySelectorAll(".media.playing").forEach(o=>{if(o!==m)stopSound(o)});   /* one video with sound at a time */
  if(m.classList.contains("clip")){   /* a clip file: start it over with sound and controls */
    const v=clipVideo(m);if(!v)return;
    m.classList.add("playing");
    v.controls=true;v.muted=false;try{v.currentTime=0}catch(_){}
    const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{})});
    return;
  }
  drop(m);
  const id=m.dataset.yt;
  m.classList.add("playing");
  m.innerHTML=LOCAL
    ?`<p class="note">Videos play once the site is online (GitHub Pages). Opened from a folder, YouTube blocks them. <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Watch on YouTube</a></p>`
    :`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1&modestbranding=1" title="${e(m.dataset.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
};
watch(document.getElementById("app"));

/* ---------- career layout: the item whose top has passed the middle of the screen is the current one;
   its card shows on the right and its video plays. scroller = what scrolls (the window, or a project page). ---------- */
const career=(root,scroller)=>{
  if(!root)return {stop(){}};
  const items=[...root.querySelectorAll(".c-item")],layers=[...root.querySelectorAll(".pcard.layer")];
  if(!items.length)return {stop(){}};
  let active=-1,queued=false;
  root.classList.add("live");
  const update=()=>{
    queued=false;
    const line=innerHeight*.5;let k=0;
    items.forEach((el,j)=>{if(el.getBoundingClientRect().top<line)k=j});
    if(k===active)return;
    const old=active;active=k;
    if(old>=0){
      items[old].classList.remove("on");
      if(layers[old]){layers[old].classList.remove("on");const m=layers[old].querySelector(".media.auto");if(m){if(m.classList.contains("playing"))stopSound(m);else sync(m)}}
    }
    items[k].classList.add("on");
    if(layers[k]){layers[k].classList.add("on");const m=layers[k].querySelector(".media.auto");if(m)sync(m)}
  };
  const ask=()=>{if(!queued){queued=true;requestAnimationFrame(update)}};
  scroller.addEventListener("scroll",ask,{passive:true});
  addEventListener("resize",ask);
  update();
  return {stop(){scroller.removeEventListener("scroll",ask);removeEventListener("resize",ask)}};
};
/* clicking a clip on the home page plays it with sound */
document.addEventListener("click",ev=>{const pl=ev.target.closest("[data-play]");if(pl&&!pl.closest(".po"))playSound(pl.closest(".media"))});

/* ---------- project / system pages ----------
   A card opens its page over the site. The page gets its own address (#its-title), so the browser's Back button
   closes it and a shared link opens it. If the browser won't let the address change (some previews block it),
   the page still opens; only the address stays the same. */
(()=>{
  const po=document.getElementById("po"),inner=po.querySelector(".po-in"),crumb=po.querySelector(".po-crumb");
  const H=Object.assign({inside:"What’s inside",loop:"The game loop"},S.pageHeadings||{});
  const hist=(fn,...a)=>{try{history[fn](...a);return true}catch(_){return false}};
  const fromHash=()=>{try{return SLUGS.indexOf(decodeURIComponent(location.hash.slice(1)))}catch(_){return -1}};
  let cur=-1,pushed=false;

  const render=i=>{
    const {d}=ENTRIES[i],id=vid(d.yt)||vid(d.link),roblox=d.link&&!vid(d.link)?url(d.link):"";
    const sys=d.systems||[],loop=points(d.loop);
    const next=ENTRIES.length>1?(i+1)%ENTRIES.length:-1;
    const partsOf=x=>x.parts||[];
    inner.innerHTML=`
<div class="wrap"><header class="po-top">
  ${d.label?`<p class="eyebrow">${e(d.label)}</p>`:""}
  <h1 id="po-title">${e(d.title)}</h1>
  ${d.about||d.blurb?`<p class="po-about">${e(d.about||d.blurb)}</p>`:""}
  ${chips(d.tags)}
  ${roblox||id?`<div class="links">${roblox?`<a href="${e(roblox)}" target="_blank" rel="noopener">Play on Roblox ${I.up}</a>`:""}${id?`<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Watch on YouTube ${I.up}</a>`:""}</div>`:""}
</header>
${d.clip||id?`<div class="po-demo">${media(d)}</div>`:""}</div>
${loop.length?`<section class="sec"><div class="wrap">
  <div class="sec-head"><h2 class="sec-title">${e(H.loop)}</h2></div>
  <ol class="loop">${loop.map((t,j)=>`<li class="step"><span>${nn(j)}</span>${e(t)}</li>${j<loop.length-1?`<li class="arr" aria-hidden="true">${I.chev}</li>`:""}`).join("")}<li class="again">${I.again}<span>repeat</span></li></ol>
</div></section>`:""}
${sys.length?`<section class="sec"><div class="wrap">${sys.map((x,j)=>{const c=colorOf(x,j),ps=partsOf(x),own=vid(x.yt);return `<article class="sysb" id="sys-${j}" style="--c:${e(c)}">
    <div class="sysb-head"><i class="dot" aria-hidden="true"></i><span class="n">${nn(j)}</span><h2>${e(x.title)}</h2>${ps.length?`<small>${ps.length} part${ps.length===1?"":"s"}</small>`:""}</div>
    ${own||!ps.length?`<div class="pcard on"><h4>${e(x.card||x.title)}</h4>${media(x)}</div>`:""}
    ${ps.length?`<div class="parts">${ps.map(pt=>`<div class="part">${media(pt)}<h3>${e(pt.title)}${pt.label?`<small>${e(pt.label)}</small>`:""}</h3></div>`).join("")}</div>`:""}
  </article>`}).join("")}</div></section>`:""}
<div class="wrap"><footer class="po-foot">
  <button class="lnk" type="button" data-close>${I.left} Back to all projects</button>
  ${next>=0?`<a class="po-next" href="#${SLUGS[next]}" data-next="${next}"><small class="eyebrow">Next project</small><b>${e(ENTRIES[next].d.title)} ${I.right}</b></a>`:""}
</footer></div>`;
    crumb.innerHTML=`Projects / <b>${e(d.title)}</b>`;
  };
  const teardown=()=>{unwatch(inner);inner.innerHTML=""};

  const show=(i,mode)=>{   /* mode: "push" = a card was clicked, "replace" = Next, "none" = Back/Forward or a shared link */
    if(!ENTRIES[i])return;
    if(cur>=0)teardown();
    render(i);cur=i;
    /* 1. open the page */
    if(!po.open){
      pageOpen=true;syncAll();
      document.documentElement.classList.add("po-open");
      try{po.showModal()}catch(_){po.setAttribute("open","")}
      try{po.focus({preventScroll:true})}catch(_){}
    }
    po.scrollTop=0;
    watch(inner);
    document.title=`${ENTRIES[i].d.title} - ${S.name}`;
    /* 2. then try to put it in the address bar */
    const h="#"+SLUGS[i];
    if(mode==="push"&&location.hash!==h){if(hist("pushState",{po:i},"",h))pushed=true}
    else if(mode==="replace")hist("replaceState",history.state,"",h);
  };
  const close=()=>{if(po.open)po.close();else if(po.hasAttribute("open")){po.removeAttribute("open");po.dispatchEvent(new Event("close"))}};
  po.addEventListener("close",()=>{
    teardown();cur=-1;
    document.documentElement.classList.remove("po-open");
    document.title=`${S.name} - ${S.role}`;
    pageOpen=false;syncAll();
    if(fromHash()>=0){
      if(pushed){pushed=false;try{history.back()}catch(_){}}
      else hist("replaceState",null,"",location.pathname+location.search);
    }
  });
  addEventListener("popstate",()=>{
    const i=fromHash();
    if(i>=0){if(i!==cur)show(i,"none")}
    else if(cur>=0){pushed=false;close()}
  });
  po.addEventListener("click",ev=>{
    const t=ev.target;
    const go=t.closest("[data-go]");
    if(go){const el=inner.querySelector("#sys-"+go.dataset.go);if(el)el.scrollIntoView({behavior:STILL?"auto":"smooth",block:"start"});return}
    const pl=t.closest("[data-play]");
    if(pl){playSound(pl.closest(".media"));return}
    if(t.closest("[data-close]")){close();return}
    const nx=t.closest("[data-next]");
    if(nx){ev.preventDefault();show(+nx.dataset.next,"replace")}
  });
  document.addEventListener("click",ev=>{
    const t=ev.target.closest("[data-open]");
    if(t&&!t.closest(".po")){ev.preventDefault();show(+t.dataset.open,"push")}
  });
  const first=fromHash();
  if(first>=0)show(first,"none");
})();

/* ---------- systems timeline: the circle of the system you're on lights up, ones you've passed stay filled,
   and the line after each circle fills in as you scroll through that system ---------- */
(()=>{
  const nav=document.getElementById("systl");
  if(!nav)return;
  const items=[...nav.querySelectorAll("li")];
  const panels=items.map(li=>document.querySelector(li.querySelector("a").getAttribute("href")));
  let queued=false;
  const update=()=>{
    queued=false;
    const line=innerHeight*.45;let k=0;
    panels.forEach((p,j)=>{if(p.getBoundingClientRect().top<line)k=j});
    const r=panels[k].getBoundingClientRect(),t=Math.min(Math.max((line-r.top)/r.height,0),1);
    items.forEach((li,j)=>{
      li.classList.toggle("on",j===k);li.classList.toggle("done",j<k);
      li.style.setProperty("--p",(j<k?100:j===k?t*100:0).toFixed(1)+"%");
      const a=li.querySelector("a");if(j===k)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current");
    });
  };
  const ask=()=>{if(!queued){queued=true;requestAnimationFrame(update)}};
  addEventListener("scroll",ask,{passive:true});
  addEventListener("resize",ask);
  update();
})();

/* ---------- the little character that follows the mouse (not on touch screens or with reduced motion) ---------- */
(()=>{
  const el=document.getElementById("buddy");
  if(!el||!matchMedia("(hover:hover) and (pointer:fine)").matches||STILL)return;
  const off=el.offsetWidth/2+8;   /* rests just below and right of the pointer so the cursor stays visible */
  let x=0,y=0,tx=0,ty=0,seen=false,busy=false,last=0;
  const put=()=>{el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`};
  const step=t=>{
    const k=1-Math.exp(-3.6*Math.min(Math.max((t-last)/1000,0),.05));   /* 3.6 = how quickly it catches up */
    last=t;x+=(tx-x)*k;y+=(ty-y)*k;put();
    if(Math.abs(tx-x)+Math.abs(ty-y)>.3)requestAnimationFrame(step);else busy=false;
  };
  addEventListener("pointermove",ev=>{
    if(ev.pointerType==="touch")return;
    tx=ev.clientX+off;ty=ev.clientY+off;
    if(!seen){seen=true;x=tx;y=ty;put();el.classList.add("on")}
    if(!busy){busy=true;last=performance.now();requestAnimationFrame(step)}
  },{passive:true});
})();
</script>
</body>
</html>
